name: Windows Test Fotos

run-name: Windows test fotos — ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag ou commit que será compilado e testado
        required: true
        default: master
        type: string
      confirmacao_producao:
        description: Digite PRODUCAO para gerar um EXE conectado ao banco real
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-test-fotos-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  test-photo-http:
    name: Teste HTTP de fotos (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout da versão escolhida
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Instalar Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rodar p1_photo_integration
        working-directory: src-tauri
        run: cargo run --locked --quiet --bin p1_photo_integration

  build-windows:
    name: Gerar instalador de teste das fotos
    needs: [test-photo-http]
    runs-on: windows-latest
    steps:
      - name: Checkout da versão escolhida
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Registrar commit compilado
        id: source
        shell: pwsh
        run: '"sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT'

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências
        run: npm ci

      - name: Impedir empacotamento de arquivos de ambiente
        shell: pwsh
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $resources = @($config.bundle.resources)
          if ($resources | Where-Object { $_ -match '(^|[\\/])\.env$' }) {
            throw "tauri.conf.json não pode empacotar .env no instalador."
          }

      - name: Confirmar build conectado à produção
        shell: pwsh
        env:
          CONFIRMACAO_PRODUCAO: ${{ inputs.confirmacao_producao }}
          AUTOOS_DATABASE_URL: ${{ secrets.AUTOOS_DATABASE_URL }}
        run: |
          if ($env:CONFIRMACAO_PRODUCAO -cne "PRODUCAO") {
            throw "Confirmação inválida. Digite PRODUCAO para continuar."
          }
          if ([string]::IsNullOrWhiteSpace($env:AUTOOS_DATABASE_URL)) {
            throw "Configure o secret AUTOOS_DATABASE_URL antes de gerar o instalador."
          }
          if ($env:AUTOOS_DATABASE_URL -notmatch '^postgres(ql)?://.+@[^/]*\.pooler\.supabase\.com:5432/postgres(?:\?.*)?$') {
            throw "AUTOOS_DATABASE_URL deve usar o Supavisor Session pooler na porta 5432 e o banco /postgres."
          }
          if ($env:AUTOOS_DATABASE_URL -notmatch '[?&]sslmode=require(?:&|$)') {
            throw "AUTOOS_DATABASE_URL deve exigir TLS com sslmode=require."
          }

      - name: Validar schema da produção em modo somente leitura
        env:
          AUTOOS_DATABASE_URL: ${{ secrets.AUTOOS_DATABASE_URL }}
        run: cargo run --manifest-path src-tauri/Cargo.toml --locked --quiet --bin release_database_check

      - name: Compilar instalador Windows conectado à produção sem publicar release
        uses: tauri-apps/tauri-action@v0
        env:
          CI: true
          COMPILE_TIME_DATABASE_URL: ${{ secrets.AUTOOS_DATABASE_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles nsis

      - name: Calcular checksums do instalador
        shell: pwsh
        run: |
          $installers = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
          if ($installers.Count -eq 0) {
            throw "Nenhum instalador NSIS foi gerado."
          }
          foreach ($installer in $installers) {
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)" | Out-File "$($installer.FullName).sha256" -Encoding ascii
          }

      - name: Publicar artefato temporário
        uses: actions/upload-artifact@v4
        with:
          name: AutoOS-Windows-Test-Fotos-${{ github.run_number }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Resumo do teste de fotos
        shell: pwsh
        run: |
          "## Instalador de teste das fotos pronto" >> $env:GITHUB_STEP_SUMMARY
          "- Origem solicitada: ``${{ inputs.ref }}``" >> $env:GITHUB_STEP_SUMMARY
          "- Commit compilado: ``${{ steps.source.outputs.sha }}``" >> $env:GITHUB_STEP_SUMMARY
          "- HTTP de fotos (JPEG, HEIC recusado, até 3) já rodou no runner Windows." >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "### Checklist no PC da recepção" >> $env:GITHUB_STEP_SUMMARY
          "1. Instalar o EXE e abrir um equipamento." >> $env:GITHUB_STEP_SUMMARY
          "2. Foto pelo celular — QR cabe na tela, URL só o host." >> $env:GITHUB_STEP_SUMMARY
          "3. Celular no 4G: um botão Adicionar fotos (câmera ou galeria), até 3." >> $env:GITHUB_STEP_SUMMARY
          "4. PC mostra OK e fecha. Celular mostra Fotos enviadas." >> $env:GITHUB_STEP_SUMMARY
          "5. Se o QR 4G falhar, copiar cloudflared.exe para a pasta AutoOS em Dados de aplicativos." >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "- Este instalador abre conectado ao banco de produção." >> $env:GITHUB_STEP_SUMMARY
          "- O túnel Cloudflare é improvisado; não é o upload do SaaS." >> $env:GITHUB_STEP_SUMMARY
          "- O artefato expira em 3 dias e não cria tag nem GitHub Release." >> $env:GITHUB_STEP_SUMMARY
