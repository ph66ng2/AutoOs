name: Windows Test Build

run-name: Windows test build — ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag ou commit que será compilado
        required: true
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: windows-test-build-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Gerar instalador de teste
    runs-on: windows-latest
    steps:
      - name: Checkout da versão escolhida
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Registrar commit compilado
        id: source
        shell: pwsh
        run: '"sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT'

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências
        run: npm ci

      - name: Validar conexão PostgreSQL de teste
        shell: pwsh
        env:
          AUTOOS_DATABASE_URL: ${{ secrets.AUTOOS_DATABASE_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AUTOOS_DATABASE_URL)) {
            throw "Configure o secret AUTOOS_DATABASE_URL antes de gerar o instalador de teste."
          }
          if ($env:AUTOOS_DATABASE_URL -notmatch '^postgres(ql)?://.+@[^/]*\.pooler\.supabase\.com:5432/[^?]+(?:\?.*)?$') {
            throw "AUTOOS_DATABASE_URL deve usar o Supavisor Session pooler na porta 5432."
          }
          if ($env:AUTOOS_DATABASE_URL -notmatch '[?&]sslmode=require(?:&|$)') {
            throw "AUTOOS_DATABASE_URL deve exigir TLS com sslmode=require."
          }

      - name: Compilar instalador Windows sem publicar release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AUTOOS_DATABASE_URL: ${{ secrets.AUTOOS_DATABASE_URL }}
        with:
          args: --bundles nsis

      - name: Publicar artefato temporário
        uses: actions/upload-artifact@v4
        with:
          name: AutoOS-Windows-Test-${{ github.run_number }}
          path: |
            src-tauri/target/release/autoos.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Resumo do teste
        shell: pwsh
        run: |
          "## Instalador de teste pronto" >> $env:GITHUB_STEP_SUMMARY
          "- Origem solicitada: ``${{ inputs.ref }}``" >> $env:GITHUB_STEP_SUMMARY
          "- Commit compilado: ``${{ steps.source.outputs.sha }}``" >> $env:GITHUB_STEP_SUMMARY
          "- O artefato expira em 3 dias e não cria tag nem GitHub Release." >> $env:GITHUB_STEP_SUMMARY
