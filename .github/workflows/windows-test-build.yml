name: Windows Test Build

run-name: Windows test build — ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag ou commit que será compilado
        required: true
        default: integration/ao-cont-orc-pdf-qa
        type: string

permissions:
  contents: read

concurrency:
  group: windows-test-build-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Gerar instalador de teste
    runs-on: windows-latest
    steps:
      - name: Checkout da versão escolhida
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Registrar commit compilado
        id: source
        shell: pwsh
        run: '"sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT'

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências
        run: npm ci

      - name: Impedir empacotamento de arquivos de ambiente
        shell: pwsh
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $resources = @($config.bundle.resources)
          if ($resources | Where-Object { $_ -match '(^|[\\/])\.env$' }) {
            throw "tauri.conf.json não pode empacotar .env no instalador."
          }

      - name: Compilar instalador Windows de teste sem banco ou release
        uses: tauri-apps/tauri-action@v0
        env:
          # O aplicativo recebe a conexão em runtime; o build de teste não
          # deve acessar banco operacional nem depender de secrets de produção.
          CI: true
        with:
          args: --bundles nsis

      - name: Calcular checksums do instalador
        shell: pwsh
        run: |
          $installers = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
          if ($installers.Count -eq 0) {
            throw "Nenhum instalador NSIS foi gerado."
          }
          foreach ($installer in $installers) {
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)" | Out-File "$($installer.FullName).sha256" -Encoding ascii
          }

      - name: Publicar artefato temporário
        uses: actions/upload-artifact@v4
        with:
          name: AutoOS-Windows-Test-${{ github.run_number }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Resumo do teste
        shell: pwsh
        run: |
          "## Instalador de teste pronto" >> $env:GITHUB_STEP_SUMMARY
          "- Origem solicitada: ``${{ inputs.ref }}``" >> $env:GITHUB_STEP_SUMMARY
          "- Commit compilado: ``${{ steps.source.outputs.sha }}``" >> $env:GITHUB_STEP_SUMMARY
          "- O build não acessa banco e não usa credenciais de produção." >> $env:GITHUB_STEP_SUMMARY
          "- O artefato expira em 3 dias e não cria tag nem GitHub Release." >> $env:GITHUB_STEP_SUMMARY
