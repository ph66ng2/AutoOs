name: Windows Test Build

# Instalador temporário de teste (NSIS). Disparo: workflow_dispatch ou PR que toque neste arquivo.
# AO-BOOT-001: validar splash stamp no instalador SaaS de staging antes do merge.
run-name: Windows test build — ${{ inputs.ref || github.head_ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag ou commit que será compilado
        required: true
        default: feature
        type: string
      modo:
        description: Produto a compilar; SaaS não usa PostgreSQL
        required: true
        default: internal
        type: choice
        options:
          - internal
          - saas
      confirmacao_producao:
        description: Digite PRODUCAO somente para o modo internal conectado ao banco real
        required: false
        type: string
  pull_request:
    branches: [feature]
    paths:
      - '.github/workflows/windows-test-build.yml'

permissions:
  contents: read

concurrency:
  group: windows-test-build-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Gerar instalador de teste
    runs-on: windows-latest
    steps:
      - name: Checkout da versão escolhida
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}

      - name: Registrar commit compilado
        id: source
        shell: pwsh
        run: '"sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT'

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências
        run: npm ci

      - name: Impedir empacotamento de arquivos de ambiente
        shell: pwsh
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $resources = @($config.bundle.resources)
          if ($resources | Where-Object { $_ -match '(^|[\\/])\.env$' }) {
            throw "tauri.conf.json não pode empacotar .env no instalador."
          }

      - name: Confirmar build interno conectado à produção
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.modo == 'internal' }}
        shell: pwsh
        env:
          CONFIRMACAO_PRODUCAO: ${{ inputs.confirmacao_producao }}
          AUTOOS_DATABASE_URL: ${{ secrets.AUTOOS_DATABASE_URL }}
        run: |
          if ($env:CONFIRMACAO_PRODUCAO -cne "PRODUCAO") {
            throw "Confirmação inválida. Digite PRODUCAO para continuar."
          }
          if ([string]::IsNullOrWhiteSpace($env:AUTOOS_DATABASE_URL)) {
            throw "Configure o secret AUTOOS_DATABASE_URL antes de gerar o instalador."
          }
          if ($env:AUTOOS_DATABASE_URL -notmatch '^postgres(ql)?://.+@[^/]*\.pooler\.supabase\.com:5432/postgres(?:\?.*)?$') {
            throw "AUTOOS_DATABASE_URL deve usar o Supavisor Session pooler na porta 5432 e o banco /postgres."
          }
          if ($env:AUTOOS_DATABASE_URL -notmatch '[?&]sslmode=require(?:&|$)') {
            throw "AUTOOS_DATABASE_URL deve exigir TLS com sslmode=require."
          }

      - name: Validar schema da produção em modo somente leitura
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.modo == 'internal' }}
        env:
          AUTOOS_DATABASE_URL: ${{ secrets.AUTOOS_DATABASE_URL }}
        run: cargo run --manifest-path src-tauri/Cargo.toml --locked --quiet --bin release_database_check

      - name: Validar configuração pública SaaS de staging
        if: ${{ github.event_name == 'pull_request' || inputs.modo == 'saas' }}
        shell: pwsh
        env:
          VITE_SUPABASE_URL: ${{ vars.AUTOOS_SAAS_STAGING_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.AUTOOS_SAAS_STAGING_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PASSWORD_RECOVERY_REDIRECT: ${{ vars.AUTOOS_SAAS_STAGING_PASSWORD_RECOVERY_REDIRECT }}
        run: |
          if ($env:VITE_SUPABASE_URL -notmatch '^https://[^/]+\.supabase\.co$') {
            throw "AUTOOS_SAAS_STAGING_URL deve ser uma URL HTTPS de projeto Supabase."
          }
          if ($env:VITE_SUPABASE_PUBLISHABLE_KEY -notmatch '^sb_publishable_') {
            throw "AUTOOS_SAAS_STAGING_PUBLISHABLE_KEY deve ser uma chave publicável."
          }
          if ($env:VITE_SUPABASE_PASSWORD_RECOVERY_REDIRECT -notmatch '^https://') {
            throw "AUTOOS_SAAS_STAGING_PASSWORD_RECOVERY_REDIRECT deve usar HTTPS."
          }
          if ($env:DATABASE_URL -or $env:AUTOOS_DATABASE_URL) {
            throw "O build SaaS de teste não aceita configuração PostgreSQL."
          }

      - name: Compilar instalador Windows interno conectado à produção sem publicar release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.modo == 'internal' }}
        uses: tauri-apps/tauri-action@v0
        env:
          CI: true
          COMPILE_TIME_DATABASE_URL: ${{ secrets.AUTOOS_DATABASE_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles nsis

      - name: Compilar instalador Windows SaaS sem publicar release
        if: ${{ github.event_name == 'pull_request' || inputs.modo == 'saas' }}
        env:
          VITE_SUPABASE_URL: ${{ vars.AUTOOS_SAAS_STAGING_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.AUTOOS_SAAS_STAGING_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PASSWORD_RECOVERY_REDIRECT: ${{ vars.AUTOOS_SAAS_STAGING_PASSWORD_RECOVERY_REDIRECT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build:saas

      - name: Calcular checksums do instalador
        shell: pwsh
        run: |
          $installers = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
          if ($installers.Count -eq 0) {
            throw "Nenhum instalador NSIS foi gerado."
          }
          foreach ($installer in $installers) {
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)" | Out-File "$($installer.FullName).sha256" -Encoding ascii
          }

      - name: Publicar artefato temporário
        uses: actions/upload-artifact@v4
        with:
          name: AutoOS-Windows-Test-${{ github.run_number }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Resumo do teste
        shell: pwsh
        run: |
          "## Instalador de teste pronto" >> $env:GITHUB_STEP_SUMMARY
          "- Origem solicitada: ``${{ inputs.ref || github.head_ref || github.ref_name }}``" >> $env:GITHUB_STEP_SUMMARY
          "- Commit compilado: ``${{ steps.source.outputs.sha }}``" >> $env:GITHUB_STEP_SUMMARY
          "- Modo interno só é conectado à produção com confirmação explícita; modo SaaS usa staging e não inicializa PostgreSQL." >> $env:GITHUB_STEP_SUMMARY
          "- O artefato expira em 3 dias e não cria tag nem GitHub Release." >> $env:GITHUB_STEP_SUMMARY
