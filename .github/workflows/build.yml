name: Build e Release Windows

on:
  push:
    tags:
      - 'v*'         # Dispara ao criar uma tag como v1.0.0, v2.3.1, etc.

  # Publica somente com versão SemVer explícita e alinhada aos manifests.
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer sem prefixo v (ex: 0.5.5). Obrigatória; sem ela o job não publica latest."
        required: true
        type: string

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write  # Necessário para criar o GitHub Release

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Instalar Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Cache do Cargo para acelerar builds futuros
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Instalar dependências do frontend
        run: npm install

      - name: Validar SemVer alinhada
        id: version
        env:
          AUTOOS_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '' }}
        run: node scripts/generate-update-manifest.mjs --check-versions

      - name: Exigir chave do updater
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Configure o secret TAURI_SIGNING_PRIVATE_KEY (ou TAURI_SIGNING_KEY) antes do release."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "Configure o secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD antes do release."
          }
          Write-Host "Chave do updater presente (conteudo omitido)."

      - name: Impedir empacotamento de arquivos de ambiente
        shell: pwsh
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $resources = @($config.bundle.resources)
          if ($resources | Where-Object { $_ -match '(^|[\\/])\.env$' }) {
            throw "tauri.conf.json não pode empacotar .env no instalador."
          }

      - name: Validar conexão PostgreSQL do release
        shell: pwsh
        env:
          AUTOOS_DATABASE_URL: ${{ secrets.AUTOOS_DATABASE_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AUTOOS_DATABASE_URL)) {
            throw "Configure o secret AUTOOS_DATABASE_URL com a URL Supavisor Session antes do release."
          }
          if ($env:AUTOOS_DATABASE_URL -notmatch '^postgres(ql)?://.+@[^/]*\.pooler\.supabase\.com:5432/postgres(?:\?.*)?$') {
            throw "AUTOOS_DATABASE_URL deve usar o Supavisor Session pooler na porta 5432 e o banco /postgres."
          }
          if ($env:AUTOOS_DATABASE_URL -notmatch '[?&]sslmode=require(?:&|$)') {
            throw "AUTOOS_DATABASE_URL deve exigir TLS com sslmode=require."
          }

      - name: Validar estruturas reais do banco
        env:
          AUTOOS_DATABASE_URL: ${{ secrets.AUTOOS_DATABASE_URL }}
        run: cargo run --manifest-path src-tauri/Cargo.toml --locked --quiet --bin release_database_check

      - name: Build e criar Release em rascunho
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Compatível com o segredo atual e com o nome recomendado pelo Tauri.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AUTOOS_DATABASE_URL: ${{ secrets.AUTOOS_DATABASE_URL }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: 'Release ${{ steps.version.outputs.tag }}'
          releaseBody: |
            Veja os assets abaixo para baixar o instalador Windows.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

      - name: Gerar e validar latest.json
        env:
          AUTOOS_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GITHUB_REF_TYPE: tag
          GITHUB_REF_NAME: ${{ steps.version.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/generate-update-manifest.mjs

      - name: Publicar release com manifesto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: latest.json
          draft: false
          make_latest: true
          fail_on_unmatched_files: true
