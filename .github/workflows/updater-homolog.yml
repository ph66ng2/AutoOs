name: Updater Homolog

# Canal isolado de homologação/hotfix do auto-updater. Não cria tag v* e não ocupa o release latest.
# Disparos aceitos (travados por assertHomologWorkflow em scripts/generate-update-manifest.mjs):
#   - workflow_dispatch com version + confirmação HOMOLOG;
#   - push de tag homolog-X.Y.Z ou hotfix-X.Y.Z (a versão vem da tag; nunca tag v*).
# Os assets da release fixa updater-homolog são sobrescritos a cada execução.
run-name: Updater homolog ${{ inputs.version || github.ref_name }}

on:
  push:
    tags:
      - "homolog-*"
      - "hotfix-*"
  workflow_dispatch:
    inputs:
      version:
        description: SemVer X.Y.Z alinhada aos manifests deste commit
        required: true
        type: string
      confirmacao:
        description: Digite HOMOLOG para publicar no canal isolado
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: updater-homolog
  cancel-in-progress: false

jobs:
  publish-homolog:
    name: Publicar instalador no canal isolado
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências
        run: npm ci

      - name: Resolver disparo (dispatch ou tag homolog-*/hotfix-*)
        id: trigger
        env:
          AUTOOS_INPUT_VERSION: ${{ inputs.version }}
          AUTOOS_INPUT_CONFIRMATION: ${{ inputs.confirmacao }}
        run: node scripts/generate-update-manifest.mjs --resolve-homolog-trigger

      - name: Validar versão no canal isolado
        id: version
        env:
          AUTOOS_UPDATER_CHANNEL: homolog
          AUTOOS_HOMOLOG_CONFIRMATION: ${{ steps.trigger.outputs.confirmacao }}
          AUTOOS_RELEASE_VERSION: ${{ steps.trigger.outputs.version }}
        run: node scripts/generate-update-manifest.mjs --check-versions

      - name: Impedir empacotamento de arquivos de ambiente
        shell: pwsh
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $resources = @($config.bundle.resources)
          if ($resources | Where-Object { $_ -match '(^|[\\/])\.env$' }) {
            throw "tauri.conf.json não pode empacotar .env no instalador."
          }

      - name: Limpar bundles de builds anteriores
        # O cache do target pode trazer instalador de outra versão; o manifesto e o upload só podem ver o build atual.
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle"
          if (Test-Path $bundle) {
            Remove-Item -Recurse -Force $bundle
          }

      - name: Compilar instalador de homologação
        # O endpoint isolado vem de src-tauri/tauri.homolog.conf.json.
        env:
          CI: true
          VITE_UPDATER_CHANNEL: homolog
          AUTOOS_UPDATER_CHANNEL: homolog
          AUTOOS_HOMOLOG_CONFIRMATION: ${{ steps.trigger.outputs.confirmacao }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build:homolog

      - name: Gerar manifesto da tag isolada
        env:
          AUTOOS_UPDATER_CHANNEL: homolog
          AUTOOS_HOMOLOG_CONFIRMATION: ${{ steps.trigger.outputs.confirmacao }}
          AUTOOS_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/generate-update-manifest.mjs

      - name: Recusar publicação no latest
        env:
          AUTOOS_UPDATER_CHANNEL: homolog
          AUTOOS_HOMOLOG_CONFIRMATION: ${{ steps.trigger.outputs.confirmacao }}
          AUTOOS_MAKE_LATEST: "false"
          AUTOOS_PRERELEASE: "true"
        run: node scripts/generate-update-manifest.mjs --assert-homolog-publish

      - name: Publicar prerelease updater-homolog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: updater-homolog
          name: Homologação do updater
          body: |
            Canal isolado de homologação. Não é o release de produção.
            A versão deste disparo é ${{ steps.version.outputs.version }}.
          files: |
            latest.json
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          draft: false
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
