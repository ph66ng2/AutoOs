name: Windows SaaS Login Test

run-name: Windows SaaS login test — ${{ inputs.ref || github.head_ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag ou commit SaaS que será compilado
        required: true
        default: feature
        type: string
  pull_request:
    branches: [feature]
    paths:
      - '.github/workflows/windows-saas-login-test.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: windows-saas-login-test-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-saas:
    name: Gerar instalador SaaS de teste
    runs-on: windows-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.AUTOOS_SAAS_STAGING_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.AUTOOS_SAAS_STAGING_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PASSWORD_RECOVERY_REDIRECT: ${{ vars.AUTOOS_SAAS_STAGING_PASSWORD_RECOVERY_REDIRECT }}
    steps:
      - name: Checkout da versão escolhida
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}

      - name: Registrar commit compilado
        id: source
        shell: pwsh
        run: '"sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT'

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências
        run: npm ci

      - name: Validar configuração pública SaaS de staging
        shell: pwsh
        run: |
          if ($env:VITE_SUPABASE_URL -notmatch '^https://[^/]+\.supabase\.co$') {
            throw "AUTOOS_SAAS_STAGING_URL deve ser uma URL HTTPS de projeto Supabase."
          }
          if ($env:VITE_SUPABASE_PUBLISHABLE_KEY -notmatch '^sb_publishable_') {
            throw "AUTOOS_SAAS_STAGING_PUBLISHABLE_KEY deve ser uma chave publicável."
          }
          if ($env:VITE_SUPABASE_PASSWORD_RECOVERY_REDIRECT -notmatch '^https://') {
            throw "AUTOOS_SAAS_STAGING_PASSWORD_RECOVERY_REDIRECT deve usar HTTPS."
          }
          if ($env:DATABASE_URL -or $env:AUTOOS_DATABASE_URL) {
            throw "O build SaaS de teste não aceita configuração PostgreSQL."
          }

      - name: Compilar instalador Windows SaaS sem publicar release
        run: npm run tauri:build:saas

      - name: Calcular checksums do instalador
        shell: pwsh
        run: |
          $installers = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
          if ($installers.Count -eq 0) {
            throw "Nenhum instalador NSIS SaaS foi gerado."
          }
          foreach ($installer in $installers) {
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)" | Out-File "$($installer.FullName).sha256" -Encoding ascii
          }

      - name: Publicar artefato temporário
        uses: actions/upload-artifact@v4
        with:
          name: AutoOS-Windows-SaaS-Login-Test-${{ github.run_number }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Resumo do teste
        shell: pwsh
        run: |
          "## Instalador SaaS de teste pronto" >> $env:GITHUB_STEP_SUMMARY
          "- Origem solicitada: ``${{ inputs.ref }}``" >> $env:GITHUB_STEP_SUMMARY
          "- Commit compilado: ``${{ steps.source.outputs.sha }}``" >> $env:GITHUB_STEP_SUMMARY
          "- Modo: SaaS; PostgreSQL não é inicializado." >> $env:GITHUB_STEP_SUMMARY
          "- O artefato expira em 3 dias e não cria tag nem GitHub Release." >> $env:GITHUB_STEP_SUMMARY
