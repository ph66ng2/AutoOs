<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="theme-color" content="#0f172a" /><title>AutoOS — Enviar fotos</title><link rel="stylesheet" href="./styles.css" /></head><body><main class="card"><p class="eyebrow">AutoOS</p><h1>Enviar fotos do equipamento</h1><p>Escolha até seis fotos em JPEG ou PNG, de no máximo 10 MB cada.</p><p id="session-error" class="notice error" hidden></p><label class="picker" for="photos">Selecionar fotos</label><input id="photos" type="file" accept="image/jpeg,image/png" capture="environment" multiple /><ul id="files" aria-live="polite"></ul><button id="send" type="button" disabled>Enviar fotos</button><p id="status" class="notice" aria-live="polite"></p></main><script src="./config.js"></script><script type="module" src="./app.js"></script></body></html>
